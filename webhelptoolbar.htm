<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>目录工具 - 5E 不全书</title>
  <link rel="stylesheet" href="assets/webhelp-compat.css">
</head>
<body>
  <nav class="compat-toolbar" aria-label="目录工具">
    <button type="button" data-action="showAll">展开全部</button>
    <button type="button" data-action="collapseAll">折叠全部</button>
    <button type="button" data-action="previous">上一篇</button>
    <button type="button" data-action="next">下一篇</button>
  </nav>
  <script>
  (function () {
    "use strict";
    document.querySelector(".compat-toolbar").addEventListener("click", function (event) {
      var button = event.target.closest("button[data-action]");
      if (!button) return;
      try {
        var tree = parent.tree || parent.frames.tree;
        if (!tree) return;
        if (button.dataset.action === "showAll") tree.showAll();
        if (button.dataset.action === "collapseAll") tree.collapseAll();
        if (button.dataset.action === "previous") tree.clickNode(tree.LastSelected - 1);
        if (button.dataset.action === "next") tree.clickNode(tree.LastSelected + 1);
      } catch (error) {}
    });
  })();
  </script>
</body>
</html>
