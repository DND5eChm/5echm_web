<P><STRONG><FONT color=#800000 size=5>易伤、抗性与免疫 Vulnerabilities, Resistances, and 
Immunities</FONT></STRONG></P>
<P>某些生物对特定的伤害类型具有易伤、抗性或者免疫。特定的生物甚至还可以对非魔法攻击造成的伤害具有抗性或免疫（魔法攻击是由法术、魔法物品或其他魔法来源发动的攻击）。此外，一些生物还免疫特定的状态。</P></body>
