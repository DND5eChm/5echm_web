<H1>第二章：黑夜中的生物 Creatures of the Night
</H1>


<P>本节描述了与阿斯代伦、他侍奉的吸血鬼之主墨菲斯托费利斯以及血族的地下世界相关的生物们。其中一些的数据卡出现在第三章的冒险故事中。你也可以将他们用在你自己的吸血鬼或恶魔主题的冒险故事里。<BR>有关怪物的更多详细信息见《怪物图鉴》。
