<P><STRONG><FONT color=#800000 size=5>夺心魔Mind Flayers</FONT></STRONG></P>
<P>在《怪物图鉴》中有描述的，是通过造具来创造的，造具的过程始于将灵吸蝌蚪植入人形宿主的大脑。在新家住了大约7天后，蝌蚪就把它的主人变成了灵吸怪。这种新的创造通常不会保留生物生前的记忆。</P></body>
