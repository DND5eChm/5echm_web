<H1>盐沼背景 Saltmarsh Backgrounds</H1>
<P>盐沼战役的一部分乐趣在于扮演与小镇及其周围区域有联系的角色。本节介绍适合创建这类角色的新背景。以及根据《玩家手册》调整角色背景的注释。<BR>此材料是DM工具。玩家一旦决定了他们的角色背景，请在此查阅材料，并决定与他们分享哪些关于他们的背景的额外元素。此处为《玩家手册》中的每一个背景提供了与盐沼的NPC的联系，或关于猩红兄弟会存在的线索。对于在此完整描述的新背景，盐沼的联系会提供这些信息。</P>
