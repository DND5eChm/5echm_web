<P><STRONG><FONT color=#800000 size=5>规划遭遇 Plan Encounters</FONT></STRONG></P>
<P>遭遇是你所作的冒险中，大型故事下的一个个独立场景。从根本上来说，遭遇就是一个设有障碍的目标。它起到以下一个或多个作用：</P>
<UL>
  <LI>
<DIV>让角色们更接近于实现目标</DIV></LI>
  <LI>
<DIV>阻碍角色们实现目标</DIV></LI>
  <LI>
<DIV>揭示新的信息</DIV></LI></UL></body>
