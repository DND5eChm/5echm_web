<H2>熔炉追风者 Crucible Storm Chaser</H2>
<P><b>属性值：</b>力量、体质、智力
<BR><b>专长：</b>奥法超负荷
<BR><b>技能熟练：</b>运动和自然
<BR><b>工具熟练：</b>玻璃匠工具
<BR><b>装备：</b>选择A或B：（A）玻璃匠工具、背包、绳索、旅行服装、15GP；或（B）50GP</P>
<P>你天生的冒险精神与对刺激的渴望，使你加入了熔炉司守——一个致力于研究自然与魔法灾害的组织。从把玩熔融的玻璃，到冲入飓风的风眼，当灾难近在咫尺时，你反而能够大放异彩。</P>
