<H1>第二章：法术 Spells</H1>
<P>下文中的全新与重置的法术可以令魔法世界更加生动。这些法术能调动强大的魔法力量，允许角色们增强其魔宠或爆破其敌人。<BR>法术依首字母排序，法术表中则给出了依照环阶排序的版本。该表格也列出了每道法术的学派与哪些职业可使用这些法术（奇械师详见《艾伯伦：奇械锻炉》）。特殊一栏中，C代表该法术需要专注，R代表该法术是一道仪式法术，而M则代表该法术具有特殊的材料成分。</P>
<div class=center>
<P>魔法师们有时候误以为他们已经知晓了多元宇宙中的所有法术。真是一群可怜的孩子，这不过是在蹒跚学步。</P>
<P align=right >
 ——艾拉斯卓</P>
