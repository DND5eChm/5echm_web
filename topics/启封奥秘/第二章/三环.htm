<H4>假寐术｜Catnap</H4>
<P><EM>三环 惑控（奇械师、吟游诗人、术士、法师）</EM> 
<BR><B>施法时间：</B>动作 
<BR><B>施法距离：</B>30尺 <BR><B>法术成分：</B>S、M（一撮沙子） 
<BR>
<B>
持续时间：
</B>10分钟
<BR>你做出一个安抚的手势，随后，你选择施法距离内至多三名你可见的自愿生物在法术持续时间内陷入昏迷状态。若目标受到伤害，或有其他生物使用动作将其摇醒，则法术对于那个目标会提前终止。若目标在该法术的整个持续时间内都具有昏迷状态，则目标会获得完成一次短休的增益，且在完成一次长休之前将不能再受到此法术的影响。
<BR ><STRONG>升环施法。</STRONG>你使用的法术位每比三环高一环，你就可以额外指定一名自愿生物作为目标。 
</P>
