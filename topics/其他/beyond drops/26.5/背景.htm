<H3>契约追寻者 Pact Seeker</H3>
<P><STRONG>属性值：</STRONG>体质、智力、魅力<BR><STRONG>专长：</STRONG> 
选择一个位面契约专长<BR><STRONG>技能熟练：</STRONG>奥秘和游说<BR><STRONG>工具熟练：</STRONG>书法工具<BR><STRONG>装备：</STRONG>选择A或B：(A)书法工具、书籍、羊皮纸（10张）、旅行服装、2GP；或(B)50GP。</P>
<P>你心中有个目标。也许你是在寻找知识或力量。或是想要发掘隐藏的秘密。不论如何，你的旅程都会引导你找到一个跨位面实体。在你联系上它的那一刻，交易就已然达成，你的人生也会因此改变。</P>
