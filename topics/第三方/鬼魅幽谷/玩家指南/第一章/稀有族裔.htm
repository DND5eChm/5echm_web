<H1 align=center>稀有族裔 Rare Heritages</H1>
<P>艾弗瑞斯的稀有族裔长久以来隐居避世，或是徘徊于那些人口众多的族裔的领地与文化边缘。拥有这些血统的角色与世人一样，面临着重重艰难险阻，但他们往往对这个世界有着自己的独到见解，而外人往往难以理解。
