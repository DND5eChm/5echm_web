<H2>人鱼 Merfolk</H2>
<P>雷霆海中被拉曼尼亚所影响的人鱼和原初伟力与位面力量具有深刻的联系。这些人鱼管理着水下的显能区，其中许多能够引导德鲁伊魔法。作为DM，你可以让角色们在雷霆海中遭遇的人鱼知晓一道来自德鲁伊法术列表的戏法。</P></body>
