<H2>背景 Backgrounds</H2>
<P>血族角色背景各异，在被初拥转化之前，他们往往来自各行各业。不过，也有一些人以这样或那样的方式生活在血族社会的边缘，以下背景正是为了呈现这类典型形象。在栖息着强大血族的世界中，这些背景适用于塑造血族角色或其它存在。</P>
