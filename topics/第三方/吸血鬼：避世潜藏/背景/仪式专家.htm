<H3>仪式专家 Ritualist</H3>
<P><STRONG>属性值：</STRONG>智力、感知、魅力<BR><STRONG>专长：</STRONG>魔法学徒（法师）<BR><STRONG>技能熟练：</STRONG>奥秘和历史<BR><STRONG>工具熟练：</STRONG>炼金工具<BR><STRONG>装备：</STRONG>选择A或B：(A)炼金工具、匕首、墨水、书籍（仪式）、旅行服装、9GP；或(B)50GP。</P>
<P>你追求神秘与玄奥的知识。你或许曾属于某个奥术师教团、祭司教派或法师议会。咒语、药剂与施法技艺让你窥见了黑暗世界，而你手中正掌握着它的一丝力量。</P>
