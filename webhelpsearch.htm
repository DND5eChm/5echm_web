<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>搜索</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    margin: 0;
    padding: 12px 12px 16px;
    font-family: "Microsoft YaHei", "Inter", sans-serif;
    background: transparent;
    color: #0f172a;
    overflow-y: auto;
}

.search-container {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
}

.search-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #0f172a;
    margin-bottom: 12px;
}

.search-input-wrapper {
    position: relative;
}

#keyword {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5f5;
    border-radius: 10px;
    font-size: 14px;
    background: #f8fafc;
    transition: all 0.2s ease;
}

#keyword:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    background: #ffffff;
    outline: none;
}

.search-help-bubble {
    display: none;
    width: 100%;
    max-width: none;
    margin-top: 6px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.6;
    color: #334155;
    background: #f8fafc;
    border: 1px solid #cbd5f5;
    border-radius: 10px;
    box-shadow: none;
}

.search-input-wrapper:focus-within .search-help-bubble {
    display: block;
}

.search-help-bubble strong {
    color: #1d4ed8;
}

.search-help-bubble code {
    background: #e0e7ff;
    color: #1e3a8a;
    border-radius: 4px;
    padding: 1px 4px;
    font-size: 11px;
}

.options-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 12px 0;
    font-size: 12px;
    color: #475569;
    flex-wrap: wrap;
}

.checkbox-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}

.checkbox-label input {
    width: 14px;
    height: 14px;
    accent-color: #2563eb;
}

.filter-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.filter-label {
    font-size: 12px;
    color: #475569;
}

.filter-select {
    min-width: 150px;
    padding: 6px 10px;
    border: 1px solid #cbd5f5;
    border-radius: 10px;
    background: #f8fafc;
    font-size: 12px;
    color: #1f2937;
}

.filter-select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    background: #ffffff;
}

.btn-group {
    display: flex;
    gap: 10px;
}

.btn {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.btn-primary {
    background: #2563eb;
    color: #ffffff;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: #e0e7ff;
    color: #1e3a8a;
}

.btn-secondary:hover {
    background: #c7d2fe;
}

.btn-ghost {
    background: transparent;
    color: #2563eb;
}

.btn-ghost:hover {
    background: rgba(37, 99, 235, 0.08);
}

.results-wrapper {
    margin-top: 14px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
}

.results-info {
    display: none;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.results-info strong {
    font-weight: 700;
}

.results-list-container {
    border: 1px solid #f1f5f9;
    border-radius: 10px;
    overflow: hidden;
}

.results-header {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    background: #f8fafc;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
}

.results-list {
    margin: 0;
    padding: 0;
    list-style: none;
    max-height: 60vh;
    overflow-y: auto;
}

.result-item {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    font-size: 12px;
    color: #1f2937;
    border-bottom: 1px solid #f1f5f9;
    cursor: pointer;
    transition: background 0.15s ease;
}

.result-item:hover {
    background: #eef2ff;
}

.result-item.selected {
    background: #e0e7ff;
    border-left: 3px solid #2563eb;
}

.result-main-title {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.result-title-text {
    font-weight: 600;
    color: #111827;
    line-height: 1.4;
}

.result-rank {
    font-size: 11px;
    font-weight: 500;
    color: #1d4ed8;
    background: rgba(37, 99, 235, 0.12);
    padding: 2px 8px;
    border-radius: 999px;
    display: inline-flex;
    width: fit-content;
}

.result-meta {
    font-size: 12px;
    color: #475569;
}

.empty-state {
    list-style: none;
    padding: 24px;
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
}

.empty-text {
    line-height: 1.6;
}

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.6);
    border-radius: 999px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

.preview-tooltip {
    position: fixed;
    top: -9999px;
    left: -9999px;
    max-width: 420px;
    width: min(420px, 45vw);
    background: #111827;
    color: #f8fafc;
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.3);
    font-size: 12px;
    line-height: 1.6;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
}

.preview-tooltip.visible {
    opacity: 1;
}

.preview-tooltip__title {
    font-weight: 600;
    margin-bottom: 6px;
    color: #cbd5f5;
}

.preview-tooltip__content {
    max-height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
}

.preview-tooltip__content mark {
    background: rgba(37, 99, 235, 0.6);
    color: #ffffff;
    border-radius: 4px;
    padding: 0 2px;
}

.preview-tooltip__empty {
    color: #94a3b8;
}

.server-error {
    background: #fee2e2;
    color: #991b1b;
    border-radius: 10px;
    padding: 14px;
    margin: 16px;
    border: 1px solid #fecaca;
    font-size: 12px;
}

:root {
    --search-bg: #f4f5f7;
    --search-surface: #ffffff;
    --search-muted-surface: #f7f7f8;
    --search-text: #242629;
    --search-muted: #666a70;
    --search-border: #e0e2e5;
    --search-accent: #991b1b;
    --search-accent-hover: #7f1515;
    --search-accent-soft: #fbeaea;
    color-scheme: light;
}

:root[data-search-theme="dark"] {
    --search-bg: #111315;
    --search-surface: #17191c;
    --search-muted-surface: #1e2125;
    --search-text: #e7e9ec;
    --search-muted: #a8adb4;
    --search-border: #34383e;
    --search-accent: #df6b6b;
    --search-accent-hover: #ec8585;
    --search-accent-soft: #3a2022;
    color-scheme: dark;
}

body {
    color: var(--search-text);
    background: var(--search-bg);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif;
}

.search-container,
.results-wrapper {
    color: var(--search-text);
    background: var(--search-surface);
    border-color: var(--search-border);
    border-radius: 8px;
    box-shadow: none;
}

.search-title,
.result-title-text {
    color: var(--search-text);
}

#keyword,
.filter-select {
    color: var(--search-text);
    background: var(--search-muted-surface);
    border-color: var(--search-border);
    border-radius: 6px;
}

#keyword:focus,
.filter-select:focus {
    background: var(--search-surface);
    border-color: #3b82f6;
}

.options-row,
.filter-label,
.result-meta,
.empty-state {
    color: var(--search-muted);
}

.checkbox-label input {
    accent-color: var(--search-accent);
}

.btn {
    border-radius: 6px;
}

.btn-primary {
    background: var(--search-accent);
}

.btn-primary:hover {
    background: var(--search-accent-hover);
}

.btn-secondary,
.result-rank,
.results-info {
    color: var(--search-accent);
    background: var(--search-accent-soft);
}

.btn-ghost {
    color: var(--search-accent);
}

.results-list-container,
.result-item {
    border-color: var(--search-border);
}

.results-header {
    color: var(--search-muted);
    background: var(--search-muted-surface);
}

.result-item:hover {
    background: var(--search-muted-surface);
}

.result-item.selected {
    background: var(--search-accent-soft);
    border-left-color: var(--search-accent);
}

@media (max-width: 600px) {
    body {
        padding: 10px max(10px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    .search-container,
    .results-wrapper {
        padding: 12px;
    }

    .results-header,
    .preview-tooltip {
        display: none;
    }

    .result-item {
        display: block;
        padding: 11px;
    }

    .result-meta {
        margin-top: 5px;
        overflow-wrap: anywhere;
    }

    .filter-item {
        flex: 1 1 150px;
        min-width: 0;
    }

    .filter-select {
        min-width: 0;
        max-width: 100%;
    }

    .btn-group {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
    }

    .btn-ghost {
        grid-column: 1 / -1;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition-duration: 0.01ms !important;
    }
}
</style>

<script>
var words = [];
var lastResultIndexes = [];
var previewTooltip;
var previewTitleElem;
var previewContentElem;
var categorySelect;
var cachedCategories = [];
var API_BASE = "https://5echmsearch.kagangtuya.top"
var highlightRequestId = 0;
var pendingContentLoadCleanup;

function searchLog(message, detail) {
    return;
}

function searchFrameContext() {
    try {
        return {
            name: window.name || '',
            href: window.location.href,
            parentName: window.parent && window.parent.name || '',
            topName: window.top && window.top.name || ''
        };
    } catch (e) {
        return { error: String(e && e.message || e) };
    }
}

function postSearchBridge(url, requestId) {
    try {
        var receiver = window.parent;
        if (!receiver || !receiver.postMessage) return;
        receiver.postMessage({
            type: 'webhelp-search-navigate',
            url: url,
            words: words.slice(),
            requestId: requestId
        }, '*');
        searchLog('bridge message sent', { requestId: requestId, url: url });
    } catch (e) {
        searchLog('bridge message failed', { requestId: requestId, error: String(e && e.message || e) });
    }
}

function resolveContentUrl(url) {
    try {
        var link = document.createElement('a');
        link.href = url;
        return link.href;
    } catch (e) {
        return url;
    }
}

if (window.addEventListener) {
    window.addEventListener('message', function(event) {
        var data = event && event.data;
        if (data && data.type === 'webhelp-search-highlighted') {
            searchLog('bridge highlight complete', data);
        }
    }, false);
    searchLog('search bridge ready');
}

function extractHighlightTerms(input) {
    if (!input) return [];
    var terms = [];
    var regex = /"([^"]+)"|(\S+)/g;
    var match;
    while ((match = regex.exec(input)) !== null) {
        var token = match[1] || match[2] || '';
        if (!token) continue;
        token.split('|').forEach(function(part) {
            var cleaned = part.trim();
            if (!cleaned) return;
            terms.push(cleaned);
        });
    }
    return terms;
}
async function SearchIt() {
    await executeSearch(false);
}

async function SearchWithinResults() {
    if (!lastResultIndexes.length) {
        renderMessage('请先执行一次完整搜索再使用结果内搜索', true);
        return;
    }
    await executeSearch(true);
}

async function executeSearch(searchWithin) {
    var keyword = document.getElementById('keyword').value.trim();
    if (!keyword) {
        renderMessage('请输入关键词后再搜索', true);
        return;
    }

    try {
        window.localStorage.setItem('5echm.webhelp.lastSearch', keyword);
    } catch (storageError) {}

    var titleOnly = document.getElementById('titleOnly').checked;
    var categoryValue = categorySelect ? (categorySelect.value || 'all') : 'all';
    renderMessage('正在搜索，请稍候…', true);

    words = extractHighlightTerms(keyword);

    var params = new URLSearchParams({
        keyword: keyword,
        titleOnly: titleOnly,
        page: 1,
        pageSize: 100
    });
    params.set('category', categoryValue);

    if (searchWithin) {
        params.set('baseIndexes', lastResultIndexes.join(','));
    }

    try {
        var response = await fetch(API_BASE + '/api/search?' + params.toString());
        if (!response.ok) {
            throw new Error('搜索失败');
        }
        var data = await response.json();
        displayResults(data);
    } catch (e) {
        console.error('API 搜索失败:', e);
        lastResultIndexes = [];
        renderMessage('搜索失败，请确认后端已运行 `node server.js`', true);
    }
}

function displayResults(data) {
    var listElem = document.getElementById('resultsList');
    listElem.innerHTML = '';

    if (data.results && data.results.length > 0) {
        lastResultIndexes = data.results.map(function(item) { return item.index; });
        document.getElementById('resultsCount').textContent = data.total;
        document.getElementById('resultsInfo').style.display = 'block';

        data.results.forEach(function(item, idx) {
            var li = document.createElement('li');
            li.className = 'result-item' + (idx === 0 ? ' selected' : '');
            var sourcePath = resolveSourcePath(item);
            var displayTitle = resolveTitle(item, sourcePath);
            li.dataset.url = item.path || '';
            li.dataset.title = displayTitle;
            li.dataset.source = sourcePath;
            li.dataset.category = item.category || '';
            li._previewText = resolvePreviewText(item);

            var titleCell = document.createElement('div');
            titleCell.className = 'result-main-title';

            var titleText = document.createElement('div');
            titleText.className = 'result-title-text';
            titleText.textContent = displayTitle;

            var rankBadge = document.createElement('div');
            rankBadge.className = 'result-rank';
            rankBadge.textContent = '相关度 ' + item.rank;

            titleCell.appendChild(titleText);
            titleCell.appendChild(rankBadge);

            var sourceCell = document.createElement('div');
            sourceCell.className = 'result-meta';
            var metaParts = [];
            if (item.category) {
                metaParts.push(item.category);
            }
            if (sourcePath) {
                metaParts.push(sourcePath);
            }
            sourceCell.textContent = metaParts.join(' · ') || '—';

            li.appendChild(titleCell);
            li.appendChild(sourceCell);

            li.addEventListener('click', function(event) {
                selectItem(li, event);
                if (li.dataset.url) {
                    hidePreview();
                    viewItem(li.dataset.url);
                }
            });

            li.addEventListener('mouseenter', function(event) {
                showPreview(li, event);
            });

            li.addEventListener('mousemove', movePreview);
            li.addEventListener('mouseleave', hidePreview);

            listElem.appendChild(li);
        });

        var first = listElem.querySelector('.result-item');
        if (first) {
            selectItem(first, null);
        }
    } else {
        lastResultIndexes = [];
        document.getElementById('resultsInfo').style.display = 'none';
        renderMessage('未找到相关结果，请尝试调整关键词', true);
    }
}

function showPreview(elem, event) {
    if (!previewTooltip) return;

    var title = (elem.dataset.title || '预览').trim();
    var snippet = (elem._previewText || '').trim();

    previewTitleElem.textContent = title || '预览';
    if (snippet) {
        previewContentElem.classList.remove('preview-tooltip__empty');
        previewContentElem.innerHTML = renderSnippet(snippet);
    } else {
        previewContentElem.classList.add('preview-tooltip__empty');
        previewContentElem.textContent = '暂无可预览的内容片段';
    }

    previewTooltip.classList.add('visible');

    var baselineY;
    if (event && typeof event.clientY === 'number') {
        baselineY = event.clientY;
    } else {
        var rect = elem.getBoundingClientRect();
        baselineY = rect.top + rect.height / 2;
    }
    positionPreview(baselineY);
}

function movePreview(event) {
    if (!previewTooltip || !previewTooltip.classList.contains('visible')) return;
    positionPreview(event.clientY);
}

function hidePreview() {
    if (!previewTooltip) return;
    previewTooltip.classList.remove('visible');
    previewTooltip.style.left = '-9999px';
    previewTooltip.style.top = '-9999px';
}

function positionPreview(cursorY) {
    if (!previewTooltip) return;
    var tooltip = previewTooltip;
    var padding = 16;
    var tooltipWidth = tooltip.offsetWidth;
    var tooltipHeight = tooltip.offsetHeight;

    var targetX = window.innerWidth - tooltipWidth - padding;
    var targetY = typeof cursorY === 'number' ? cursorY - tooltipHeight / 2 : (window.innerHeight - tooltipHeight) / 2;

    targetY = Math.max(padding, Math.min(window.innerHeight - tooltipHeight - padding, targetY));

    tooltip.style.left = targetX + 'px';
    tooltip.style.top = targetY + 'px';
}

function renderSnippet(snippet) {
    var truncated = snippet.length > 900 ? snippet.slice(0, 900) + '…' : snippet;
    var safeSnippet = escapeHtml(truncated || '');
    words.forEach(function(word) {
        var escaped = escapeRegExp(word);
        if (!escaped) return;
        var regex = new RegExp(escaped, 'gi');
        safeSnippet = safeSnippet.replace(regex, function(match) {
            return '<mark>' + match + '</mark>';
        });
    });
    return safeSnippet
        .replace(/\r\n/g, '<br>')
        .replace(/\r/g, '<br>')
        .replace(/\n/g, '<br>');
}

function renderMessage(message, clearPreview) {
    document.getElementById('resultsInfo').style.display = 'none';
    var listElem = document.getElementById('resultsList');
    listElem.innerHTML = '<li class="empty-state"><div class="empty-text">' + escapeHtml(message) + '</div></li>';
    if (clearPreview) {
        hidePreview();
    }
}

function getContentWindow() {
    var current;
    try {
        // Search page may sit inside nav -> webhelpframe -> main frames.
        // Start here, then walk parents until the sibling content frame appears.
        current = window;
    } catch (e) {
        current = window;
    }

    for (var depth = 0; current && depth < 12; depth++) {
        try {
            var namedContent = current.frames && current.frames['content'];
            if (namedContent && namedContent.document) {
                searchLog('content frame found by name', { depth: depth, name: current.name || '' });
                return namedContent;
            }
        } catch (namedFrameError) {
            searchLog('named content lookup failed', { depth: depth, error: String(namedFrameError && namedFrameError.message || namedFrameError) });
        }
        try {
            var ownerDocument = current.document;
            var frame = ownerDocument && ownerDocument.getElementById('content');
            if (!frame && ownerDocument && ownerDocument.getElementsByName) {
                var namedFrames = ownerDocument.getElementsByName('content');
                frame = namedFrames && namedFrames[0];
            }
            if (frame && frame.contentWindow && frame.contentWindow.document) {
                searchLog('content frame found by DOM', { depth: depth, name: current.name || '' });
                return frame.contentWindow;
            }
            if (!current.parent || current.parent === current) break;
            current = current.parent;
        } catch (e2) {
            searchLog('parent frame walk failed', { depth: depth, error: String(e2 && e2.message || e2) });
            break;
        }
    }
    searchLog('content frame walk exhausted');
    return null;
}

function getContentFrame() {
    var contentWin = getContentWindow();
    if (!contentWin) return null;
    try {
        var ownerDocument = contentWin.frameElement && contentWin.frameElement.ownerDocument;
        return ownerDocument ? contentWin.frameElement : null;
    } catch (e) {
        return null;
    }
}

function contentLocationMatches(contentWin, expectedUrl) {
    if (!contentWin || !expectedUrl) return true;
    try {
        var expectedLink = document.createElement('a');
        expectedLink.href = expectedUrl;
        var expectedPath = (expectedLink.pathname || '').replace(/\/$/, '');
        var currentPath = (contentWin.location.pathname || '').replace(/\/$/, '');
        if (!expectedPath || !currentPath) return true;
        var expectedDecoded = decodeURIComponent(expectedPath).toLowerCase();
        var currentDecoded = decodeURIComponent(currentPath).toLowerCase();
        return currentDecoded === expectedDecoded ||
            currentDecoded.slice(-expectedDecoded.length - 1) === '/' + expectedDecoded;
    } catch (e) {
        return true;
    }
}

function clearContentHighlights(contentDoc) {
    if (!contentDoc) return;

    var state = contentDoc.__searchHighlightState;
    if (state && state.keydownHandler) {
        contentDoc.removeEventListener('keydown', state.keydownHandler);
    }

    var navigator = contentDoc.getElementById('searchHighlightNavigator');
    if (navigator && navigator.parentNode) {
        navigator.parentNode.removeChild(navigator);
    }

    var marks = contentDoc.querySelectorAll('mark[data-search-highlight="true"]');
    for (var i = 0; i < marks.length; i++) {
        var mark = marks[i];
        if (mark.parentNode) {
            mark.parentNode.replaceChild(contentDoc.createTextNode(mark.textContent || ''), mark);
        }
    }
    contentDoc.__searchHighlightState = null;
}

function ensureContentHighlightStyle(contentDoc) {
    if (!contentDoc || !contentDoc.head) return;
    if (contentDoc.getElementById('searchHighlightStyle')) return;

    var style = contentDoc.createElement('style');
    style.id = 'searchHighlightStyle';
    style.textContent =
        'mark[data-search-highlight="true"] {' +
        ' background: #fde68a; color: inherit; padding: 1px 2px; border-radius: 2px;' +
        ' font-weight: 500;' +
        '}' +
        '#searchHighlightNavigator {' +
        ' position: fixed; top: 12px; right: 16px; z-index: 2147483647;' +
        ' display: flex; align-items: center; gap: 6px; padding: 6px 8px;' +
        ' border: 1px solid rgba(148, 163, 184, .55); border-radius: 8px;' +
        ' background: rgba(255, 255, 255, .96); color: #1e293b;' +
        ' box-shadow: 0 4px 14px rgba(15, 23, 42, .18);' +
        ' font: 12px/1.2 Arial, sans-serif;' +
        '}' +
        '#searchHighlightNavigator button {' +
        ' border: 0; border-radius: 5px; padding: 4px 7px; cursor: pointer;' +
        ' background: #e0e7ff; color: #1e3a8a; font: inherit;' +
        '}' +
        '#searchHighlightNavigator button:hover:not(:disabled) { background: #c7d2fe; }' +
        '#searchHighlightNavigator button:disabled { opacity: .45; cursor: default; }' +
        '#searchHighlightNavigator .search-highlight-count {' +
        ' min-width: 42px; text-align: center; white-space: nowrap; font-weight: 600;' +
        '}';
    contentDoc.head.appendChild(style);
}

function updateHighlightNavigator(state) {
    if (!state || !state.counter) return;
    var total = state.marks.length;
    state.counter.textContent = total ? (state.index + 1) + ' / ' + total : '未找到';
    state.previous.disabled = total < 2;
    state.next.disabled = total < 2;
}

function jumpToHighlight(state, index, smooth) {
    if (!state || !state.marks.length) return;

    if (state.index >= 0 && state.marks[state.index]) {
        state.marks[state.index].removeAttribute('data-search-active');
        state.marks[state.index].style.background = '';
        state.marks[state.index].style.color = '';
        state.marks[state.index].style.outline = '';
    }
    state.index = (index + state.marks.length) % state.marks.length;
    var mark = state.marks[state.index];
    mark.setAttribute('data-search-active', 'true');
    mark.style.background = '#f59e0b';
    mark.style.color = '#111827';
    mark.style.outline = '2px solid rgba(245, 158, 11, .45)';
    updateHighlightNavigator(state);

    try {
        mark.scrollIntoView({
            behavior: smooth ? 'smooth' : 'auto',
            block: 'center',
            inline: 'nearest'
        });
    } catch (e) {
        mark.scrollIntoView(true);
    }
}

function createHighlightNavigator(contentDoc, marks) {
    var navigator = contentDoc.createElement('div');
    navigator.id = 'searchHighlightNavigator';
    navigator.setAttribute('role', 'navigation');
    navigator.setAttribute('aria-label', '搜索关键词导航');

    var previous = contentDoc.createElement('button');
    previous.type = 'button';
    previous.textContent = '上一个';
    previous.setAttribute('aria-label', '上一个关键词');

    var counter = contentDoc.createElement('span');
    counter.className = 'search-highlight-count';

    var next = contentDoc.createElement('button');
    next.type = 'button';
    next.textContent = '下一个';
    next.setAttribute('aria-label', '下一个关键词');

    navigator.appendChild(previous);
    navigator.appendChild(counter);
    navigator.appendChild(next);
    contentDoc.body.appendChild(navigator);

    var state = {
        marks: marks,
        index: -1,
        navigator: navigator,
        previous: previous,
        next: next,
        counter: counter,
        keydownHandler: null
    };
    previous.addEventListener('click', function() {
        jumpToHighlight(state, state.index - 1, true);
    });
    next.addEventListener('click', function() {
        jumpToHighlight(state, state.index + 1, true);
    });
    state.keydownHandler = function(event) {
        if (!event.altKey || (event.key !== 'ArrowUp' && event.key !== 'ArrowDown')) return;
        event.preventDefault();
        jumpToHighlight(state, state.index + (event.key === 'ArrowUp' ? -1 : 1), true);
    };
    contentDoc.addEventListener('keydown', state.keydownHandler);
    updateHighlightNavigator(state);
    return state;
}

function highlightInContent(requestId, expectedUrl) {
    if (words.length === 0) return;

    var attempts = 0;
    var maxAttempts = 30;
    searchLog('highlight scheduled', { requestId: requestId, expectedUrl: expectedUrl, words: words });

    function retry() {
        if (requestId && requestId !== highlightRequestId) return;
        attempts++;
        if (attempts >= maxAttempts) return;
        if (attempts === 1 || attempts % 5 === 0) {
            searchLog('highlight retry', { requestId: requestId, attempts: attempts });
        }
        setTimeout(tryHighlight, 200);
    }

    function tryHighlight() {
        if (requestId && requestId !== highlightRequestId) return;
        try {
            var contentWin = getContentWindow();
            if (!contentWin) {
                if (attempts === 0 || attempts % 5 === 0) searchLog('content frame not found', { requestId: requestId, attempts: attempts });
                retry();
                return;
            }
            var contentDoc = contentWin.document;
            if (!contentDoc || !contentDoc.body || contentDoc.readyState === 'loading') {
                if (attempts === 0 || attempts % 5 === 0) {
                    searchLog('content document not ready', {
                        requestId: requestId,
                        attempts: attempts,
                        readyState: contentDoc && contentDoc.readyState,
                        href: contentWin.location && contentWin.location.href
                    });
                }
                retry();
                return;
            }
            if (!contentLocationMatches(contentWin, expectedUrl)) {
                if (attempts === 0 || attempts % 5 === 0) {
                    searchLog('content URL mismatch', {
                        requestId: requestId,
                        attempts: attempts,
                        expectedUrl: expectedUrl,
                        actualUrl: contentWin.location.href
                    });
                }
                retry();
                return;
            }

            clearContentHighlights(contentDoc);
            ensureContentHighlightStyle(contentDoc);

            var terms = words.filter(function(word, index, list) {
                return word && list.indexOf(word) === index;
            }).sort(function(a, b) {
                return b.length - a.length;
            });
            if (!terms.length) return;

            var regex = new RegExp('(' + terms.map(escapeRegExp).join('|') + ')', 'gi');
            var walker = contentDoc.createTreeWalker(contentDoc.body, NodeFilter.SHOW_TEXT, null, false);
            var nodesToProcess = [];
            var node;
            while ((node = walker.nextNode())) {
                var tagName = node.parentNode && node.parentNode.tagName;
                if (tagName !== 'SCRIPT' && tagName !== 'STYLE' && tagName !== 'NOSCRIPT' && tagName !== 'MARK') {
                    nodesToProcess.push(node);
                }
            }

            nodesToProcess.forEach(function(textNode) {
                var text = textNode.nodeValue || '';
                regex.lastIndex = 0;
                var match;
                var lastIndex = 0;
                var fragment = contentDoc.createDocumentFragment();
                var found = false;

                while ((match = regex.exec(text)) !== null) {
                    found = true;
                    if (match.index > lastIndex) {
                        fragment.appendChild(contentDoc.createTextNode(text.slice(lastIndex, match.index)));
                    }
                    var mark = contentDoc.createElement('mark');
                    mark.setAttribute('data-search-highlight', 'true');
                    mark.textContent = match[0];
                    fragment.appendChild(mark);
                    lastIndex = match.index + match[0].length;
                    if (match[0].length === 0) regex.lastIndex++;
                }

                if (!found) return;
                if (lastIndex < text.length) {
                    fragment.appendChild(contentDoc.createTextNode(text.slice(lastIndex)));
                }
                textNode.parentNode.replaceChild(fragment, textNode);
            });

            var marks = Array.prototype.slice.call(contentDoc.querySelectorAll('mark[data-search-highlight="true"]'));
            var state = createHighlightNavigator(contentDoc, marks);
            contentDoc.__searchHighlightState = state;
            searchLog('highlight complete', {
                requestId: requestId,
                href: contentWin.location.href,
                terms: terms,
                matches: marks.length
            });
            if (marks.length) {
                jumpToHighlight(state, 0, false);
            }
        } catch (e) {
            if (attempts === 0 || attempts % 5 === 0) {
                searchLog('highlight exception', { requestId: requestId, attempts: attempts, error: String(e && e.message || e) });
            }
            retry();
        }
    }

    setTimeout(tryHighlight, 0);
}

function viewSelected() {
    var selected = document.querySelector('.result-item.selected');
    if (selected) {
        var url = selected.dataset.url;
        if (url) {
            viewItem(url);
        }
    }
}

function viewItem(url) {
    var requestId = ++highlightRequestId;
    var targetUrl = resolveContentUrl(url);
    var bridgeSent = false;
    if (pendingContentLoadCleanup) {
        pendingContentLoadCleanup();
        pendingContentLoadCleanup = null;
    }

    try {
        var contentWin = getContentWindow();
        var contentFrame = getContentFrame();
        searchLog('view item', {
            requestId: requestId,
            url: url,
            targetUrl: targetUrl,
            context: searchFrameContext(),
            contentWindowFound: !!contentWin,
            contentFrameFound: !!contentFrame
        });
        if (contentFrame && contentFrame.addEventListener) {
            var removeContentLoadListener;
            var onContentLoad = function() {
                removeContentLoadListener();
                highlightInContent(requestId, targetUrl);
            };
            contentFrame.addEventListener('load', onContentLoad);
            removeContentLoadListener = function() {
                contentFrame.removeEventListener('load', onContentLoad);
                if (pendingContentLoadCleanup === removeContentLoadListener) {
                    pendingContentLoadCleanup = null;
                }
            };
            pendingContentLoadCleanup = removeContentLoadListener;
        }
        if (!contentWin) {
            postSearchBridge(targetUrl, requestId);
            bridgeSent = true;
            searchLog('using cross-origin content bridge', { requestId: requestId });
            return;
        }
        contentWin.location.href = targetUrl;
        searchLog('navigation assigned', { requestId: requestId, href: contentWin.location.href });
        // Some browsers do not dispatch load on nested <frame>; retry after navigation too.
        [150, 600, 1500].forEach(function(delay) {
            setTimeout(function() {
                if (requestId === highlightRequestId) {
                    highlightInContent(requestId, targetUrl);
                }
            }, delay);
        });
    } catch (e) {
        searchLog('view item exception', { requestId: requestId, error: String(e && e.message || e) });
        console.error('跳转失败:', e);
        if (!bridgeSent) postSearchBridge(targetUrl, requestId);
        try {
            window.open(targetUrl, 'content');
            if (!bridgeSent) highlightInContent(requestId, targetUrl);
        } catch (e2) {
            console.error('备用跳转也失败:', e2);
        }
    }
}

function selectItem(elem, event) {
    var items = document.querySelectorAll('.result-item');
    items.forEach(function(item) {
        item.classList.remove('selected');
    });
    elem.classList.add('selected');
    showPreview(elem, event || null);
}

function escapeHtml(text) {
    return String(text || '').replace(/[&<>"']/g, function(ch) {
        return ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[ch];
    });
}

function escapeRegExp(text) {
    return String(text || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function resolveSourcePath(item) {
    if (!item) return '';
    var rawPath = (item.sourcePath || item.path || '').toString();
    var normalized = rawPath.replace(/\\+/g, '/');
    if (/^topics\//i.test(normalized)) {
        normalized = normalized.replace(/^topics\//i, '');
    }
    return normalized;
}

function resolveTitle(item, sourcePath) {
    var title = (item && item.title ? item.title : '').toString().trim();
    if (title) {
        return title;
    }
    var fallback = sourcePath.split('/').pop() || '';
    return fallback.replace(/\.(html?|htm)$/i, '') || '未命名页面';
}

function resolvePreviewText(item) {
    if (!item) return '';
    var text = (item.preview || item.content || item.snippet || '').toString();
    return text.replace(/\r\n/g, '\n').replace(/\n\r/g, '\n').replace(/\r/g, '\n');
}

function populateCategoryOptions(list, defaultCategory) {
    if (!categorySelect) return;
    var select = categorySelect;
    select.innerHTML = '';

    var optionAll = document.createElement('option');
    optionAll.value = 'all';
    optionAll.textContent = '全部分类';
    select.appendChild(optionAll);

    var seen = new Set();
    (list || []).forEach(function(cat) {
        var value = (cat || '').trim();
        if (!value || seen.has(value)) return;
        seen.add(value);
        var option = document.createElement('option');
        option.value = value;
        option.textContent = value === defaultCategory ? value + '（未分类）' : value;
        select.appendChild(option);
    });
}

function loadCategoryOptions() {
    if (!categorySelect) return;
    categorySelect.disabled = true;
    fetch(API_BASE + '/api/filters')
        .then(function(resp) {
            if (!resp.ok) {
                throw new Error('failed');
            }
            return resp.json();
        })
        .then(function(data) {
            cachedCategories = Array.isArray(data.categories) ? data.categories : [];
            populateCategoryOptions(cachedCategories, data.defaultCategory || '');
        })
        .catch(function() {
            cachedCategories = [];
            populateCategoryOptions([], '');
        })
        .finally(function() {
            categorySelect.disabled = false;
        });
}

function applySearchTheme() {
    var setting = 'system';
    try {
        setting = window.localStorage.getItem('5echm.webhelp.theme') || 'system';
    } catch (storageError) {}
    var dark = setting === 'dark' || (setting === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-search-theme', dark ? 'dark' : 'light');
}

function setupResultKeyboard() {
    document.addEventListener('keydown', function(event) {
        var items = Array.prototype.slice.call(document.querySelectorAll('.result-item'));
        var input = document.getElementById('keyword');
        if (event.key === 'Escape') {
            if (input.value) {
                input.value = '';
                input.focus();
            } else {
                try { window.parent.postMessage({ type: 'webhelp-search-close' }, '*'); } catch (e) {}
            }
            return;
        }
        if (event.key === 'Enter' && event.target !== input && items.length) {
            event.preventDefault();
            viewSelected();
            return;
        }
        if (!items.length || (event.key !== 'ArrowDown' && event.key !== 'ArrowUp')) return;
        event.preventDefault();
        var selected = document.querySelector('.result-item.selected');
        var index = Math.max(0, items.indexOf(selected));
        index = Math.max(0, Math.min(items.length - 1, index + (event.key === 'ArrowDown' ? 1 : -1)));
        selectItem(items[index]);
        items[index].tabIndex = -1;
        items[index].focus();
        items[index].scrollIntoView({ block: 'nearest' });
    });
}

function initialSearchQuery() {
    try {
        return new URL(window.location.href).searchParams.get('q') || window.localStorage.getItem('5echm.webhelp.lastSearch') || '';
    } catch (e) {
        return '';
    }
}

function init() {
    applySearchTheme();
    previewTooltip = document.getElementById('previewTooltip');
    previewTitleElem = document.getElementById('previewTooltipTitle');
    previewContentElem = document.getElementById('previewTooltipContent');
    hidePreview();
    categorySelect = document.getElementById('categoryFilter');
    if (categorySelect) {
        loadCategoryOptions();
        categorySelect.addEventListener('change', function() {
            if (document.getElementById('keyword').value.trim()) {
                SearchIt();
            }
        });
    }
    var titleOnlyCheckbox = document.getElementById('titleOnly');
    if (titleOnlyCheckbox) {
        titleOnlyCheckbox.addEventListener('change', function() {
            if (document.getElementById('keyword').value.trim()) {
                SearchIt();
            }
        });
    }
    var keywordInput = document.getElementById('keyword');
    var initialQuery = initialSearchQuery();
    if (initialQuery) keywordInput.value = initialQuery;
    keywordInput.focus();
    setupResultKeyboard();
    if (initialQuery) SearchIt();

    fetch(API_BASE + '/api/search?keyword=test').then(function() {
    }).catch(function() {
        var listElem = document.getElementById('resultsList');
        listElem.innerHTML = '<li class="empty-state"><div class="empty-text">后端服务未启动，请运行 `node server.js`</div></li>';
    });
}
</script>
</head>

<body onload="init()">
<div class="search-container">
    <div class="search-header">
        <div class="search-title">文档智能搜索</div>
    </div>

    <form onsubmit="SearchIt(); return false;">
        <div class="search-input-wrapper">
            <input
                type="text"
                id="keyword"
                placeholder="输入多个关键词默认取交集，例如：腰带 巨人"
                autocomplete="off"
            >
            <div class="search-help-bubble">
                <strong>搜索提示：</strong>空格分隔的词语会同时匹配；使用竖线 <code>|</code> 表示其中任意一个；用引号括起的短语会精确匹配全文；配合右侧“分类”筛选可以快速缩小范围。
            </div>
        </div>

        <div class="options-row">
            <label class="checkbox-label">
                <input type="checkbox" id="titleOnly">
                <span>只匹配标题</span>
            </label>
            <div class="filter-item">
                <span class="filter-label">分类</span>
                <select id="categoryFilter" class="filter-select">
                    <option value="all">全部分类</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">搜索</button>
            <button type="button" class="btn btn-secondary" onclick="SearchWithinResults()">结果内搜索</button>
            <button type="button" class="btn btn-ghost" onclick="viewSelected()">打开选中页面</button>
        </div>
    </form>
</div>

<div class="results-wrapper">
    <div class="results-info" id="resultsInfo">
        找到 <strong id="resultsCount">0</strong> 个匹配结果
    </div>

    <div class="results-list-container">
        <div class="results-header">
            <span>标题与相关度</span>
            <span>来源路径</span>
        </div>
        <ul class="results-list" id="resultsList">
            <li class="empty-state">
                <div class="empty-text">输入关键词即可开始搜索</div>
            </li>
        </ul>
    </div>
</div>

<div class="preview-tooltip" id="previewTooltip">
    <div class="preview-tooltip__title" id="previewTooltipTitle">预览</div>
    <div class="preview-tooltip__content preview-tooltip__empty" id="previewTooltipContent">悬停结果可查看内容片段</div>
</div>

<script>
(function() {
    var original = window.viewItem;
    var sequence = 0;
    if (typeof original !== 'function') return;
    window.viewItem = function(url) {
        try {
            var link = document.createElement('a');
            link.href = url;
            var receiver = window.parent;
            if (receiver && receiver.postMessage) receiver.postMessage({
                type: 'webhelp-search-navigate',
                requestId: ++sequence,
                url: link.href,
                words: (window.words || []).slice()
            }, '*');
        } catch (e) {}
        return original.apply(this, arguments);
    };
})();
</script>
</body>
</html>
